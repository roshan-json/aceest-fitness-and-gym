name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -q

  code-quality:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage xml --include=src/*
          coverage report

      - name: SonarQube credentials debug
        run: |
          echo "SONAR_HOST_URL set: ${SONAR_HOST_URL:+yes}"
          echo "SONAR_TOKEN set: ${SONAR_TOKEN:+yes}"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=roshan-json_aceest-fitness-and-gym
            -Dsonar.organization=roshan-json
            -Dsonar.projectName="ACEEST Fitness and Gym"
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.login=${{ env.SONAR_TOKEN }}
      - name: SonarQube Quality Gate Check
        id: quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Generate SonarQube Report
        if: success()  # Only run if analysis succeeded
        run: |
          echo "Generating SonarQube quality report..."
          
          # Download CNES Report JAR
          curl -L -o sonar-cnes-report.jar \
            https://github.com/cnescatlab/sonar-cnes-report/releases/download/4.3.0.0/sonar-cnes-report-4.3.0.0.jar
          
          # Generate DOCX report
          java -jar sonar-cnes-report.jar \
            -t ${{ env.SONAR_TOKEN }} \
            -s ${{ env.SONAR_HOST_URL }} \
            -p aceest-fitness-and-gym \
            -o sonarqube-report.docx
          
          echo "Report generated successfully"

      - name: Upload Report Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-quality-report
          path: sonarqube-report.docx
          retention-days: 30

      - name: Print SonarQube Report URL
        if: always()
        run: |
          echo "SonarQube Analysis Complete!"
          echo "View your report at: https://sonarcloud.io/dashboard?id=aceest-fitness-and-gym"
          echo "Quality Gate Status: ${{ steps.quality-gate.outputs.quality-gate-status }}"
          echo "Project Key: aceest-fitness-and-gym"
          echo "Organization: roshan-json"
  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install YAML validator
        run: pip install pyyaml

      - name: Validate Kubernetes manifests
        run: |
          python3 << 'EOF'
          import yaml
          import os
          import sys
          
          valid = True
          for root, dirs, files in os.walk('k8s'):
              for file in files:
                  if file.endswith(('.yaml', '.yml')):
                      filepath = os.path.join(root, file)
                      print(f"Validating {filepath}...")
                      try:
                          with open(filepath, 'r') as f:
                              yaml.safe_load(f)
                          print(f"  ✓ Valid")
                      except yaml.YAMLError as e:
                          print(f"  ✗ Invalid: {e}")
                          valid = False
          
          if valid:
              print("\nAll Kubernetes manifests are valid!")
              sys.exit(0)
          else:
              print("\nSome manifests have errors!")
              sys.exit(1)
          EOF

  build-and-push:
    name: Build and push Docker image
    needs: [test, validate-k8s, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.code-quality.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerFile/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:latest
